name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python tests and smoke training
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke train for one step
        run: |
          python train.py \
            --max-iters 1 \
            --eval-interval 1 \
            --eval-iters 1 \
            --sample-tokens 20 \
            --output-dir outputs/ci-smoke \
            --checkpoint-path outputs/ci-smoke/model.pt
